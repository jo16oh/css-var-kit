name: Release

# Merging a release PR bumps this file; the run releases whatever version main carries that has no tag yet.
on:
  push:
    branches: [main]
    paths: [packages/css-var-kit/package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      due: ${{ steps.tag.outputs.due }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve tag
        id: tag
        run: |
          tag="v$(node -p "require('./packages/css-var-kit/package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # ls-remote exits 2 when the tag is absent; any other failure must not pass for "absent".
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || status=$?
          case $status in
            0) echo "::notice::$tag already exists; nothing to release"; echo "due=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "due=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      # A version bump that did not come through `just bump-version` stops here instead of releasing.
      - name: Verify commit is a merged release PR
        if: steps.tag.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
            jq -e --arg tag "$TAG" 'any(.[];
              .merged_at != null
              and .head.repo.full_name == .base.repo.full_name
              and .head.ref == "chore/release-\($tag[1:])"
              and .title == "chore: release \($tag)")' > /dev/null ||
            { echo "::error::$GITHUB_SHA is not a merged chore/release-${TAG#v} PR titled \"chore: release $TAG\""; exit 1; }

      - name: Verify tag matches package versions
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -o pipefail
          {
            for f in packages/*/package.json; do
              echo "$f $(node -p "require('./$f').version")"
            done
            node -e '
              const { optionalDependencies } = require("./packages/css-var-kit/package.json");
              for (const [name, version] of Object.entries(optionalDependencies))
                console.log("css-var-kit optionalDependencies", name, version);
            '
            cargo metadata --format-version 1 --no-deps |
              jq -r '.packages[] | select(.name == "css-var-kit") | "Cargo.toml \(.version)"'
          } | awk -v tag="${TAG#v}" '$NF != tag { print "::error::" $0 " != " tag; failed = 1 } END { exit failed }'

  build:
    needs: verify
    if: needs.verify.outputs.due == 'true'
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            npm-pkg: cli-darwin-arm64
            binary: cvk
          - target: x86_64-apple-darwin
            os: macos-latest
            npm-pkg: cli-darwin-x64
            binary: cvk
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            npm-pkg: cli-linux-x64
            binary: cvk
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            npm-pkg: cli-linux-arm64
            binary: cvk
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            npm-pkg: cli-win32-x64
            binary: cvk.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p css-var-kit

      - name: Copy binary to npm package
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} packages/${{ matrix.npm-pkg }}/${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.npm-pkg }}
          path: packages/${{ matrix.npm-pkg }}/${{ matrix.binary }}

  # Tags are immutable, so tagging only after the builds pass keeps a broken build from burning its version.
  tag:
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Only deploy keys may create release tags (the tag ruleset), so the push goes over SSH with the
      # `release` environment's key. The agent holding it ends with this step, and the key never hits disk.
      - name: Create tag
        run: |
          eval "$(ssh-agent -s)" > /dev/null
          trap 'ssh-agent -k > /dev/null' EXIT
          ssh-add -q - <<< "$RELEASE_TAG_KEY"
          curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com \(.)"' > "$RUNNER_TEMP/known_hosts"
          git -c core.sshCommand="ssh -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts" \
            push "git@github.com:$GITHUB_REPOSITORY.git" "$GITHUB_SHA:refs/tags/$TAG"
        env:
          RELEASE_TAG_KEY: ${{ secrets.RELEASE_TAG_KEY }}
          TAG: ${{ needs.verify.outputs.tag }}

  publish:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure Git to use HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Place binaries into npm packages
        run: |
          for pkg in cli-darwin-arm64 cli-darwin-x64 cli-linux-x64 cli-linux-arm64 cli-win32-x64; do
            cp artifacts/$pkg/* packages/$pkg/
            chmod +x packages/$pkg/cvk* 2>/dev/null || true
          done

      - name: Publish platform packages to npm
        run: |
          for pkg in cli-darwin-arm64 cli-darwin-x64 cli-linux-x64 cli-linux-arm64 cli-win32-x64; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$name@$version" version &>/dev/null 2>&1; then
              echo "Skipping $name@$version (already published)"
            else
              npm publish "./packages/$pkg" --access public
            fi
          done

      - name: Publish main package to npm
        run: |
          name=$(node -p "require('./packages/css-var-kit/package.json').name")
          version=$(node -p "require('./packages/css-var-kit/package.json').version")
          if npm view "$name@$version" version &>/dev/null 2>&1; then
            echo "Skipping $name@$version (already published)"
          else
            npm publish ./packages/css-var-kit --access public
          fi

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="css-var-kit") | .version')
          if curl -sf "https://crates.io/api/v1/crates/css-var-kit/$version" \
            -H "User-Agent: css-var-kit-releaser" | jq -e '.version.num' &>/dev/null 2>&1; then
            echo "Skipping css-var-kit@$version (already published)"
          else
            cargo publish -p css-var-kit
          fi

  publish-vscode:
    needs: tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - npm-pkg: cli-darwin-arm64
            vsce-target: darwin-arm64
            binary: cvk
          - npm-pkg: cli-darwin-x64
            vsce-target: darwin-x64
            binary: cvk
          - npm-pkg: cli-linux-arm64
            vsce-target: linux-arm64
            binary: cvk
          - npm-pkg: cli-linux-x64
            vsce-target: linux-x64
            binary: cvk
          - npm-pkg: cli-win32-x64
            vsce-target: win32-x64
            binary: cvk.exe
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy LICENSE
        run: cp LICENSE packages/vscode/LICENSE

      - name: Build extension
        working-directory: packages/vscode
        run: pnpm run build

      - name: Download binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.npm-pkg }}
          path: packages/vscode/bin

      - name: Make binary executable
        run: chmod +x packages/vscode/bin/${{ matrix.binary }}

      - name: Package VSIX
        working-directory: packages/vscode
        run: npx @vscode/vsce package --no-dependencies --target ${{ matrix.vsce-target }}

      - name: Publish to Marketplace
        working-directory: packages/vscode
        run: npx @vscode/vsce publish --no-dependencies --packagePath ./*.vsix -p ${{ secrets.VSCE_PAT }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix-${{ matrix.vsce-target }}
          path: packages/vscode/*.vsix

  github-release:
    needs: [verify, publish-vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Package release archives
        run: |
          mkdir -p dist
          for dir in artifacts/cli-*; do
            pkg=$(basename "$dir")
            tar -czf "dist/css-var-kit-${pkg#cli-}.tar.gz" -C "$dir" .
          done
          cp artifacts/vsix-*/*.vsix dist/ 2>/dev/null || true

      # The notes come from the PRs merged since the previous tag, grouped by `.github/release.yml`;
      # edit them on the release page afterwards if needed.
      - name: Create GitHub Release
        run: gh release create "$TAG" --verify-tag --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
