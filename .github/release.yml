# Groups the notes the release workflow generates. A PR with no label lands in the last category,
# where its Conventional Commits subject already says what it is.
changelog:
  exclude:
    labels: ["skip-changelog"]
  categories:
    - title: 💥 Breaking
      labels: ["breaking"]
    - title: ✨ Features
      labels: ["enhancement"]
    - title: 🔧 Fixes
      labels: ["bug"]
    - title: 📝 Docs
      labels: ["documentation"]
    - title: 📦 Dependencies
      labels: ["dependencies"]
    - title: 🧹 Everything else
      labels: ["*"]
